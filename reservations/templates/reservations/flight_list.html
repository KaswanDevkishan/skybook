<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Flights | SkyBook</title>
  </head>
  <body>
    <h1>Flights</h1>
    <ul>
      {% for flight in flights %}
        <li>
          <a href="{% url 'reservations:flight_detail' flight_id=flight.id %}">
            {{ flight }}
          </a>
          — {{ flight.departure_time }}
        </li>
      {% empty %}
        <li>No flights are currently scheduled.</li>
      {% endfor %}
    </ul>
  </body>
</html>
