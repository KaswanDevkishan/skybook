{% extends "reservations/base.html" %}

{% block title %}{{ flight }} | SkyBook{% endblock %}

{% block content %}
<h2>{{ flight }}</h2>

<dl>
    <dt>Airline</dt>
    <dd>{{ flight.airline }}</dd>

    <dt>Route</dt>
    <dd>{{ flight.origin }} to {{ flight.destination }}</dd>

    <dt>Departure</dt>
    <dd>{{ flight.departure_time }}</dd>

    <dt>Arrival</dt>
    <dd>{{ flight.arrival_time }}</dd>
</dl>
{% endblock %}
