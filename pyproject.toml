[project]
name = "skybook"
version = "0.1.0"
description = "Django-based airline ticket reservation system for a Web Engineering course"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<6.0",
]

[dependency-groups]
dev = [
    "coverage>=7.14.3",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.11.1",
    "ruff>=0.15.20",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["skybook", "reservations", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=skybook --cov=reservations --cov-report=term-missing"
DJANGO_SETTINGS_MODULE = "skybook.settings"

[tool.coverage.run]
source = ["skybook", "reservations"]
omit = ["tests/*", "*/migrations/*", "manage.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]
