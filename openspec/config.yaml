schema: spec-driven

context: |
  SkyBook is a Web Engineering course project using Python 3.12, Django,
  SQLite, uv, Ruff, Pytest, and coverage. Exercise 5 uses Django as the sole
  runtime web framework.

  Exercise 5 permits the initial Django project, City, Airline, Flight, Seat,
  and Booking models, admin registration, migrations, and model tests. Use
  Django's built-in authentication user model, allow guest bookings, and prevent
  duplicate seat bookings with a database constraint. Do not implement flight
  search pages, authentication screens, payments, the seat-map interface, or the
  complete booking workflow.

  Read relevant OpenSpec documents before meaningful implementation. Use
  pyproject.toml and CI as the source of truth for development commands.

rules:
  proposal:
    - State whether work is allowed within the current exercise.
    - Identify deferred application features as non-goals.
  design:
    - Keep the architecture Django-based and appropriate for a course project.
    - Preserve database-backed duplicate-seat protection.
  specs:
    - Distinguish planned domain behavior from currently implemented behavior.
  tasks:
    - Keep flight search, authentication screens, payments, seat maps, and the complete booking workflow out of scope.
    - Include formatting, linting, testing, and OpenSpec validation where relevant.
