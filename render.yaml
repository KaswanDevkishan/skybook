services:
  - type: web
    name: skybook
    runtime: python
    plan: free
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: uv sync --frozen --no-dev && uv run python manage.py collectstatic --noinput
    preDeployCommand: uv run python manage.py migrate
    startCommand: uv run gunicorn skybook.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /health/
    envVars:
      - key: DEBUG
        value: "false"
      - key: SECURE_HSTS_SECONDS
        value: "3600"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: skybook-postgres
          property: connectionString

databases:
  - name: skybook-postgres
    plan: free
    databaseName: skybook
    user: skybook
